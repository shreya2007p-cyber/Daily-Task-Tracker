
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Daily Task Tracker</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 35px 20px;
      background: #f4f6fb;
      color: #20253a;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #1d2b4d12;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { color: #737b90; margin-bottom: 26px; }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #d9deea;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn { background: #4f46e5; color: white; }
    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0 12px;
      font-size: 14px;
      color: #626b80;
    }

    .track {
      height: 7px;
      background: #e8eaf2;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    #progress {
      height: 100%;
      width: 0;
      background: #4f46e5;
      transition: width .2s;
    }

    #taskList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .task input { flex: none; width: 17px; height: 17px; }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .completed {
      text-decoration: line-through;
      color: #9298a8;
    }

    .delete-btn { background: #fff0f0; color: #c03945; }
    #emptyMessage { text-align: center; padding: 28px 0; color: #858ca0; }
    #status { min-height: 20px; color: #b42318; font-size: 13px; margin-top: 12px; }

    @media (max-width: 450px) {
      .container { padding: 20px; }
      .input-row { flex-wrap: wrap; }
      .input-row input { flex-basis: 100%; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Daily Task Tracker</h1>
    <p class="subtitle">Small steps. Real progress.</p>

    <form id="taskForm" class="input-row">
      <input
        id="taskInput"
        type="text"
        maxlength="500"
        placeholder="What do you need to do?"
        aria-label="New task"
        required
      >
      <button class="add-btn" type="submit">+ Add Task</button>
    </form>

    <div class="stats">
      <span id="taskCount">0 tasks</span>
      <span id="progressText">0% complete</span>
    </div>

    <div class="track">
      <div id="progress"></div>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage">No tasks yet. Add your first task!</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
